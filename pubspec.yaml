name: kamloka
description: "KAMLOKA - Kamera Lokasi"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.1
  get: ^4.7.3
  permission_handler: ^12.0.1
  native_device_orientation: ^2.1.3
  geolocator: ^14.1.1
  http: ^1.5.0
  image: ^4.5.4
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/kamloka_typo.png
    - assets/images/kamloka_typo_white.png

flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#FFFFFF"
  image: assets/icon/kamloka_typo.png
  android: true
  ios: false
  web: false
  fullscreen: false
  android_gravity: center
  android_12:
    color: "#FFFFFF"
    color_dark: "#FFFFFF"
    icon_background_color: "#FFFFFF"
